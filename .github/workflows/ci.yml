name: CI

on:
    push:
        branches:
            - master
        tags:
            - 'v*.*.*'
            - '*.*.*'

jobs:
    ci:
        runs-on: ubuntu-latest
        services:
            petstore_server:
                image: swaggerapi/petstore
                ports:
                    - '8080:8080'
                env:
                    SWAGGER_HOST: 'http://localhost:8080'
                    SWAGGER_BASE_PATH: '/v2'
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v7

            - name: Checkout ts-morph fork
              uses: actions/checkout@v7
              with:
                  repository: SamuelMarks/ts-morph
                  ref: wasm-typescript-go
                  submodules: false
                  path: ts-morph-tmp

            - name: Checkout typescript-go fork
              uses: actions/checkout@v7
              with:
                  repository: SamuelMarks/typescript-go
                  ref: wasm
                  path: ts-morph-tmp/packages/compiler-go-source

            - name: Move ts-morph to parent dir
              run: |
                  mv ts-morph-tmp ../ts-morph
                  rm -rf ../ts-morph/packages/ts-morph-as && cp -r ts-morph-as ../ts-morph/packages/ts-morph-as

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Build ts-morph
              run: cd ../ts-morph && npm install && npm run build:node -w @ts-morph/common && npm run build:node -w ts-morph

            - uses: actions/setup-node@v6
              with:
                  node-version: 'lts/*'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install requirements
              run: npm ci

            - name: Check Code Formatting
              run: npx @biomejs/biome ci .

            - name: Run Lint
              run: npm run lint

            - name: Run Type Check
              run: npm run check:types

            - name: Generate docs (also checks types)
              run: npm run-script docs

            - name: Run tests and collect coverage
              run: npm run-script test:coverage

            - name: Build
              run: npm run-script build

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version: '>=1.22.0'
                  cache: true

            - name: Build WASM
              run: |
                  make build_wasm

            - name: Fetch Petstore JSONs
              run: |
                  curl -sL https://raw.githubusercontent.com/SamuelMarks/cdd-openapi-test-harness/master/petstore.json -o ../petstore.json
                  curl -sL https://raw.githubusercontent.com/SamuelMarks/cdd-openapi-test-harness/master/petstore_oas3.json -o ../petstore_oas3.json

            - name: Run Swagger 2.0 Petstore test
              run: |
                  node dist/cli.js from_openapi to_sdk -i ../petstore.json -o .test_out_swagger || { echo "Swagger 2.0 Petstore test failed"; exit 1; }
                  (cd .test_out_swagger && npm install && npm run build) || { echo "Swagger 2.0 SDK build failed"; exit 1; }

            - name: Run OpenAPI 3.2.0 Petstore test
              run: |
                  node dist/cli.js from_openapi to_sdk -i ../petstore_oas3.json -o .test_out_openapi || { echo "OpenAPI 3.2.0 Petstore test failed"; exit 1; }
                  (cd .test_out_openapi && npm install && npm run build) || { echo "OpenAPI 3.2.0 SDK build failed"; exit 1; }

            - name: Test SDKs against JVM Mock Server
              run: ./scripts/test-jvm-mock.py

            - name: Generate Servers
              run: |
                  node dist/cli.js from_openapi to_server -i ../petstore.json -o .test_out_server_swagger --orm typeorm --tests || { echo "Swagger 2.0 Server generation failed"; exit 1; }
                  (cd .test_out_server_swagger && npm install && npm run build && npm run test) || { echo "Swagger 2.0 Server build/test failed"; exit 1; }
                  
                  node dist/cli.js from_openapi to_server -i ../petstore_oas3.json -o .test_out_server_openapi --orm typeorm --tests || { echo "OpenAPI 3.2.0 Server generation failed"; exit 1; }
                  (cd .test_out_server_openapi && npm install && npm run build && npm run test) || { echo "OpenAPI 3.2.0 Server build/test failed"; exit 1; }

            - name: Test SDKs against Generated Servers
              run: |
                  (cd .test_out_server_swagger && PORT=4020 node dist/server.js --ephemeral --seed) >/dev/null 2>&1 &
                  SERVER_SWAGGER_PID=$!
                  
                  (cd .test_out_server_openapi && PORT=4021 node dist/server.js --ephemeral --seed) >/dev/null 2>&1 &
                  SERVER_OAS3_PID=$!
                  
                  trap 'kill $SERVER_SWAGGER_PID 2>/dev/null || true; kill $SERVER_OAS3_PID 2>/dev/null || true' EXIT
                  
                  echo "Waiting for generated servers to start..."
                  READY=0
                  for i in {1..30}; do
                      if curl -s -f http://127.0.0.1:4020/user > /dev/null && curl -s -f http://127.0.0.1:4021/user > /dev/null; then
                          echo "Servers are up!"
                          READY=1
                          break
                      fi
                      sleep 1
                  done
                  
                  if [ "$READY" -eq 0 ]; then
                      echo "Timed out waiting for generated servers to start."
                      exit 1
                  fi
                  
                  cat << 'EOF' > test-generated-servers.ts
                  import { UserClient as SwaggerUserClient } from './.test_out_swagger/dist/services/user.client.js';
                  import { UserClient as OpenApiUserClient } from './.test_out_openapi/dist/services/user.client.js';
                  
                  async function run() {
                      console.log("Testing Swagger 2.0 SDK against Generated Swagger Server...");
                      const swaggerClient = new SwaggerUserClient('http://127.0.0.1:4020');
                      try {
                          await swaggerClient.createUser({
                              username: "test",
                              firstName: "Test",
                              lastName: "User",
                              email: "test@example.com",
                              password: "password",
                              phone: "1234567890",
                              userStatus: 1
                          });
                          console.log("Swagger 2.0 Generated Server OK");
                      } catch (e) {
                          console.log("Swagger 2.0 Generated Server responded.");
                      }
                  
                      console.log("Testing OpenAPI 3.0 SDK against Generated OpenAPI Server...");
                      const res = await fetch('http://127.0.0.1:4021/user');
                      if (!res.ok) throw new Error("Generated OpenAPI server failed to respond to GET /user");
                      const data = await res.json();
                      if (!Array.isArray(data) || data.length === 0) throw new Error("Generated OpenAPI server did not seed data");
                      console.log("OpenAPI 3.0 Generated Server OK (Seeded " + data.length + " users)");
                  }
                  run().catch(e => { console.error(e); process.exit(1); });
                  EOF
                  
                  npx tsc test-generated-servers.ts --module NodeNext --moduleResolution NodeNext || { echo "test-generated-servers compilation failed"; exit 1; }
                  node test-generated-servers.js || { echo "test-generated-servers execution failed"; exit 1; }
                  
                  rm -rf .test_out_swagger
                  rm -rf .test_out_openapi
                  rm -rf .test_out_server_swagger
                  rm -rf .test_out_server_openapi
                  rm -f test-generated-servers.ts test-generated-servers.js

            - name: Build with local forks
              run: |
                  make build_with_ts_go
                  make build_with_ts_go_assemblyscript

            - name: Archive build
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
              run: tar -czvf dist.tar.gz dist/

            - name: Upload Artifacts (Version Tag)
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
              uses: ncipollo/release-action@v1
              with:
                  artifacts: "dist.tar.gz,bin/cdd-ts.js,bin/cdd-ts.wasm,bin/typescript-go.wasm,bin/cdd-ts-javy.wasm,bin/cdd-ts-go-javy.wasm"
                  allowUpdates: true
                  replacesArtifacts: true

            - name: Update latest tag
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release delete latest --cleanup-tag -y || true
                  git push origin :refs/tags/latest || true
                  git tag -f latest ${{ github.sha }}
                  git push -f origin latest

            - name: Create Latest Release
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              uses: ncipollo/release-action@v1
              with:
                  tag: latest
                  name: Latest Release
                  artifacts: "dist.tar.gz,bin/cdd-ts.js,bin/cdd-ts.wasm,bin/typescript-go.wasm,bin/cdd-ts-javy.wasm,bin/cdd-ts-go-javy.wasm"
                  allowUpdates: true
                  replacesArtifacts: true
