name: CI

on:
    push:
        branches:
            - master

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Checkout ts-morph fork
              uses: actions/checkout@v4
              with:
                  repository: SamuelMarks/ts-morph
                  ref: wasm-typescript-go
                  submodules: false
                  path: ts-morph-tmp

            - name: Checkout typescript-go fork
              uses: actions/checkout@v4
              with:
                  repository: SamuelMarks/typescript-go
                  ref: wasm
                  path: ts-morph-tmp/packages/compiler-go-source

            - name: Move ts-morph to parent dir
              run: |
                  mv ts-morph-tmp ../ts-morph
                  rm -rf ../ts-morph/packages/ts-morph-as && cp -r ts-morph-as ../ts-morph/packages/ts-morph-as

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Build ts-morph
              run: cd ../ts-morph && npm install && npm run build:node -w @ts-morph/common && npm run build:node -w ts-morph

            - uses: actions/setup-node@v4
              with:
                  node-version: 'lts/*'

            - name: Install requirements
              run: npm ci

            - name: Check Code Formatting
              run: npx prettier --check 'src/**/*.ts' 'tests/**/*.ts'

            - name: Run Lint
              run: npm run lint

            - name: Run Type Check
              run: npm run check:types

            - name: Generate docs (also checks types)
              run: npm run-script docs

            - name: Run tests and collect coverage
              run: npm run-script test:coverage

            - name: Build
              run: npm run-script build

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: '>=1.22.0'
                  cache: true

            - name: Build WASM
              run: |
                  make build_wasm

            - name: Fetch Petstore JSONs
              run: |
                  curl -sL https://raw.githubusercontent.com/SamuelMarks/cdd-openapi-test-harness/master/petstore.json -o ../petstore.json
                  curl -sL https://raw.githubusercontent.com/SamuelMarks/cdd-openapi-test-harness/master/petstore_oas3.json -o ../petstore_oas3.json

            - name: Run Swagger 2.0 Petstore test
              run: |
                  node dist/cli.js from_openapi to_sdk -i ../petstore.json -o .test_out_swagger || { echo "Swagger 2.0 Petstore test failed"; exit 1; }
                  rm -rf .test_out_swagger

            - name: Run OpenAPI 3.2.0 Petstore test
              run: |
                  node dist/cli.js from_openapi to_sdk -i ../petstore_oas3.json -o .test_out_openapi || { echo "OpenAPI 3.2.0 Petstore test failed"; exit 1; }
                  rm -rf .test_out_openapi

            - name: Build with local forks
              run: |
                  make build_with_ts_go
                  make build_with_ts_go_assemblyscript

            - name: Upload coverage report artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: ./coverage

            - name: Upload coverage reports to Codecov with GitHub Action
              uses: codecov/codecov-action@v5
              with:
                  files: ./coverage/lcov.info
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

            - name: Upload test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/test-results-action@v1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  #          flags: report-type="test_results"
                  flags: unittests
                  files: ./coverage/junit.xml
                  disable_search: true
                  verbose: true
